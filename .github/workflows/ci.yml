---
name: CI

# Lint once, build the wheel and sdist once, then test that exact wheel on every os × python. Releases are made
# locally (`make publish`), nothing here uploads anything.
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:  # a new push cancels the still running checks of the previous one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade ruff
      - run: ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # same shell on Windows: `rm -rf`, `dist/*.whl` glob
    strategy:
      fail-fast: false  # one broken os / python must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true  # 3.15
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel
        run: |
          rm -rf dynamic_import  # the source tree must not shadow the installed wheel
          python -m pip install --upgrade pytest dist/*.whl
      - name: Test
        run: pytest -q -p no:cacheprovider
      - name: Example
        working-directory: example
        run: python calling.py

  check:  # the one status check the `main` ruleset requires; fails unless every job above passed
    if: always()  # a skipped job counts as passed, so always run and test the results
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.test.result }}" = success
