---
name: Release

# `make tag` + `git push origin v<version>` starts this: build once, test that exact wheel on every
# os × python, publish to PyPI (trusted publishing, no stored token), then create the GitHub release.
on:  # yamllint disable-line rule:truthy
  push:
    tags: ["v*", "[0-9]*"]  # new `v2026.10.26`, old bare `2024.5.2`

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Tag matches version.py
        run: |
          version=$(python -c "import dynamic_import; print(dynamic_import.__version__)")
          test "$version" = "${GITHUB_REF_NAME#v}" || { echo "tag $GITHUB_REF_NAME != version.py $version"; exit 1; }

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # Windows too: `rm -rf`, `dist/*.whl` globs
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Test the built wheel
        run: |
          rm -rf dynamic_import  # the source tree must not shadow the installed wheel
          python -m pip install --upgrade pytest dist/*.whl
          pytest -q

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes \
            --title "Dynamic Import - ${GITHUB_REF_NAME#v}"
