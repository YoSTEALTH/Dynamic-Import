---
name: Test

on: [push, pull_request, workflow_dispatch]  # yamllint disable-line rule:truthy

concurrency:  # a new push cancels the still running checks of the previous one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip ruff pytest coverage
          python -m pip install --upgrade .

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Test with PyTest
        run: |
          coverage run -p -m pytest

      - name: Build and check package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir build/dist
          python -m twine check --strict build/dist/*

      - name: Coverage Report
        run: |
          coverage combine
          coverage json

